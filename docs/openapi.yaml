components:
  securitySchemes:
    StaffSession:
      type: http
      scheme: bearer
      bearerFormat: Opaque expiring staff session
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Original operation UUID scoped to actor and business/site.
      schema:
        type: string
        format: uuid
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShortageId:
      name: shortageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReturnId:
      name: returnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: >-
        See the transport rules for stable code and HTTP mapping. Protected records are omitted on denied
        scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    SignIn:
      type: object
      properties:
        loginId:
          type: string
          pattern: ^[a-z0-9][a-z0-9@._-]{2,119}$
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - loginId
        - password
      additionalProperties: false
    InvitationRedemption:
      type: object
      properties:
        invitation:
          type: string
          minLength: 32
          maxLength: 256
        password:
          type: string
          minLength: 12
          maxLength: 256
      required:
        - invitation
        - password
      additionalProperties: false
    Enrollment:
      type: object
      additionalProperties: false
      required:
        - personId
      properties:
        personId:
          type: string
          format: uuid
    Session:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        expiresAt:
          type: string
          format: date-time
    Site:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - timeZone
        - roles
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        timeZone:
          type: string
          minLength: 1
          maxLength: 80
        roles:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum:
              - owner
              - supervisor
              - picker
              - packer
              - handoff
              - support
    SiteList:
      type: object
      additionalProperties: false
      required:
        - sites
      properties:
        sites:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/Site"
    ReleaseLineInput:
      type: object
      additionalProperties: false
      required:
        - sourceLineRef
        - sku
        - bin
        - units
        - unit
      properties:
        sourceLineRef:
          type: string
          minLength: 1
          maxLength: 80
        sku:
          type: string
          minLength: 1
          maxLength: 80
        bin:
          type: string
          minLength: 1
          maxLength: 64
        units:
