openapi: 3.1.0
info:
  title: OrderFlow local fulfillment API
  version: 0.1.0
  description: >-
    OrderFlow synthetic IT API. Warehouse commands operate on manually released local work. Bootstrap and
    invitation creation use the local operator utility.
servers:
  - url: http://127.0.0.1:5761
    description: Development loopback or authorized debug-only ADB reverse.
security:
  - StaffSession: []
paths:
  /healthz:
    get:
      operationId: health
      summary: Check process liveness
      security: []
      responses:
        "200":
          description: Process available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /readyz:
    get:
      operationId: readiness
      summary: Check database and migration readiness
      security: []
      responses:
        "200":
          description: Database available and schema current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sessions:
    post:
      operationId: signIn
      summary: Authenticate an enrolled staff member
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "201":
          description: New session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/invitation-redemptions:
    post:
      operationId: redeemInvitation
      summary: Set credentials for one scoped, unexpired invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRedemption"
      responses:
        "201":
          description: Invitation consumed and account enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sessions/current:
    delete:
      operationId: signOut
      summary: Revoke current session
      responses:
        "204":
          description: Session revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sites:
    get:
      operationId: listSites
      summary: List current scoped site grants
      responses:
        "200":
          description: Sites associated with the subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sites/{siteId}/releases:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: createRelease
      summary: Enter a verified manual release
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseInput"
      responses:
        "201":
          description: Durable release receipt. Same-key retry replays this receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Revision, source or idempotency conflict. Current state appears only on an authorized projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conflict"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sites/{siteId}/work:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listWork
      summary: List a stable scoped queue page
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: Server-scoped cursor. Use with the original filters.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Maximum rows for a page.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - released
              - claimed
              - picking
              - exception
              - picked
              - packed
              - handed_over
              - cancelled
          description: Filter by work status.
        - name: assignment
          in: query
          schema:
            type: string
            enum:
              - available
              - mine
          description: Optional assignment projection.
        - name: reference
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 80
          description: Exact normalized order reference.
      responses:
        "200":
          description: Queue page and snapshot information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Revision, source or idempotency conflict. Current state appears only on an authorized projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conflict"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/sites/{siteId}/work/{workId}:
    parameters:
